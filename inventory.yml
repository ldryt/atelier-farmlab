all:
  vars:
    cors_domains:
      - "https://farmlab.lemaker.fr"
      - "http://farmlab"
      - "http://{{ inventory_hostname }}.local"

    system_user: pi
    install_dir: "/home/{{ system_user }}"

    klipper_repo: "https://github.com/Klipper3d/klipper"
    klipper_version: "v0.13.0"

    moonraker_repo: "https://github.com/Arksine/moonraker"
    moonraker_version: "1ed102edfb34906115bfeb02712d4c839b93a7a9"

    mainsail_repo: "https://github.com/mainsail-crew/mainsail"
    mainsail_version: "v2.17.0"
    mainsail_www_dir: "/var/www/mainsail"
    mainsail_local_build_dir: "./mainsail-build"

    go2rtc_version: "v1.9.14"
    stun_server: "stuns:ice.ldryt.dev:5349"
    turn_server: "turns:ice.ldryt.dev:5349"
    turn_user: "farmlab_atelier_epita"
    turn_password_file: "{{ install_dir }}/ice.ldryt.dev.txt"

  hosts:
    farmlab:
      ansible_host: farmlab
      printers:
        - name: sidewinder_1
          model: artillery_sidewinder_x1
          usb_port: 1-1.2.4.4
          moonraker:
            port: 7125
          camera: "/dev/video0"
        - name: sidewinder_2
          model: artillery_sidewinder_x1
          usb_port: 1-1.2.4.3
          moonraker:
            port: 7126
        - name: sidewinder_3
          model: artillery_sidewinder_x1
          usb_port: 1-1.2.4.2
          moonraker:
            port: 7127
        - name: duplicator_1
          model: wanhao_duplicator_12_300
          usb_port: 1-1.2.4.1
          moonraker:
            port: 7128
